[package]
name = "tiinyapp-farm-launcher"
version = "0.1.2"
description = "The Tiiny App Farm launcher"
authors = ["Titanium Computing"]
edition = "2021"
rust-version = "1.82"
publish = false

# Standalone Tauri app. The empty table stops cargo walking up the tree looking
# for a workspace root.
[workspace]

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name, which
# Windows needs. See rust-lang/cargo#8519.
name = "tiinyapp_farm_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# The catalog and the health checks are read from Rust rather than from the
# page, so the web view never needs a network origin of its own.
reqwest = { version = "0.13", default-features = false, features = ["json", "charset", "http2", "rustls", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
