name: linux

# The third platform, and the honest one about what it cannot promise.
#
# There is no notarisation on Linux and nothing to sign an AppImage against that
# a stranger's machine would check, so this builds unsigned and says so. That is
# not a gap in this workflow, it is how desktop Linux works: the checksum
# published beside the file is what somebody can verify, and the release page
# carries it.
#
# Nothing here can be exercised beyond the runner. There is no Linux machine on
# this team, so the tray, the deep link and the window are built and never seen.
# The report says that in those words rather than implying otherwise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ github.workspace }}/.cargo
  CARGO_INCREMENTAL: 0

jobs:
  bundle:
    name: Linux AppImage (x86_64, unsigned)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Tauri 2 on Ubuntu 22.04. webkit2gtk 4.1 is the one Tauri 2 links
      # against; 4.0 is Tauri 1 and installing both is how a build picks the
      # wrong one. libxdo is the tray and the global shortcut, patchelf and
      # the FUSE library are what the AppImage bundler itself needs.
      - name: What Tauri needs on this runner
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            patchelf \
            desktop-file-utils \
            file
          pkg-config --modversion webkit2gtk-4.1

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-gnu
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # The same staged runtime as the other two platforms, from the same pins
      # file, pruned by the same list. The interpreter has to run here, which is
      # why each platform stages its own.
      - name: Stage the bundled Python and the pinned farm
        run: node scripts/stage-runtime.mjs --target x86_64-unknown-linux-gnu

      - name: The staged engine answers before anything is bundled
        run: |
          set -eu
          ./src-tauri/runtime/bin/python3.11 -m farm.farm --version
          node -p "require('./src-tauri/runtime/runtime.json').target"

      - name: Clean stale bundle outputs
        run: rm -rf src-tauri/target/release/bundle/appimage

      - name: tauri build (AppImage, unsigned)
        run: npm run tauri -- build --bundles appimage

      # An AppImage is one file and it has to be executable to be anything at
      # all. This is the whole of what can be checked without a Linux desktop:
      # it exists, it is an ELF executable, and it is the size a bundle with a
      # Python tree inside it should be.
      - name: What was built, checked as far as a runner can
        run: |
          set -eu
          APP=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          ls -l "$APP"
          test -x "$APP"
          file "$APP" | grep -q ELF
          SIZE=$(stat -c%s "$APP")
          if [ "$SIZE" -lt 30000000 ]; then
            echo "::error::$APP is $SIZE bytes, which is too small to hold the bundled Python."
            exit 1
          fi
          echo "the AppImage is an executable ELF of $SIZE bytes"

      # The same order as Windows, and for a simpler reason: nothing rewrites
      # an AppImage after it is built, but signing the final file rather than
      # asking the bundler to do it keeps one rule across all three platforms,
      # which is that the signature is made over the bytes that get uploaded.
      # No key, no signature, and no linux-x86_64 row in the feed: an installed
      # Linux copy then just never sees an update, which is where it was before.
      # A gate step rather than `if: env.UPDATER_KEY != ''` on the steps
      # themselves. A step's own `env:` is NOT in scope for its own `if:`, so
      # that spelling reads an empty string every time and the step never runs:
      # green, silent, and no linux-x86_64 row in the feed for anybody to
      # notice. The other two workflows decide the same way, in a step.
      - name: Decide whether this run can sign for the updater
        id: gate
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -eu
          updater=false
          if [ -n "${UPDATER_KEY:-}" ]; then updater=true; fi
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "updater=$updater"
          if [ "$updater" != "true" ]; then
            echo "::notice::No Linux updater signature. TAURI_SIGNING_PRIVATE_KEY is not set, so latest.json will carry no linux-x86_64 row and an installed AppImage will not update itself."
          fi

      - name: Sign the AppImage for the updater, and check it
        if: steps.gate.outputs.updater == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          DIR=src-tauri/target/release/bundle/appimage
          APP=$(ls "$DIR"/*.AppImage | head -1)
          rm -f "$DIR"/*.AppImage.sig
          npx tauri signer sign "$APP"
          test -s "$APP.sig"
          node scripts/verify-updater-signature.mjs "$APP" "$APP.sig"

      - name: Write the feed fragment
        if: steps.gate.outputs.updater == 'true'
        run: |
          set -eu
          DIR=src-tauri/target/release/bundle/appimage
          APP=$(ls "$DIR"/*.AppImage | head -1)
          node scripts/write-feed-fragment.mjs linux-x86_64 "$APP"
          cat feed/linux-x86_64.json

      # What the bytes are, written by the machine that made them, so whatever
      # publishes them later has something to compare against. Same shape as the
      # other two platforms write.
      - name: Record what the bytes are
        run: |
          set -eu
          cd src-tauri/target/release/bundle/appimage
          sha256sum *.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: tiinyapp-farm-launcher-linux-appimage
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/appimage/SHA256SUMS
            feed/linux-x86_64.json
          if-no-files-found: error
