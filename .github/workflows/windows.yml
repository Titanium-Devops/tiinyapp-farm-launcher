name: windows

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/.targets/winci
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: windows-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-test-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # tauri-build refuses to build at all when a declared resource path is
      # not there, and `runtime` is not committed: it is fetched and staged.
      # Staging it here also means the staging script is exercised on Windows
      # before the long installer job starts, which is how the prune pattern
      # that ate Lib/threading.py was caught.
      - name: Stage the bundled Python and the pinned farm
        run: node scripts/stage-runtime.mjs --target x86_64-pc-windows-msvc

      # The JSON reader, the progress reader, the state machine and the deep
      # link parser are plain Rust with no window behind them, so this runner is
      # a real test run and not a compile check.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test

  installer:
    name: Windows installer (NSIS, x64, signed)
    runs-on: windows-latest
    permissions:
      id-token: write # GitHub OIDC token for the azure/login federated credential
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ env.CARGO_TARGET_DIR }}
          key: windows-cargo-installer-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            windows-cargo-installer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      # Node is here for the Tauri CLI and the staging script. The front end is
      # plain files in ui/ with no build step.
      - name: npm ci
        run: npm ci

      # x64 only, which is decision 7 on the design page. An arm64 leg would be
      # another signed artifact, another cache and another pinned runtime, and
      # nobody has asked for one yet.
      - name: Stage the bundled Python and the pinned farm
        run: node scripts/stage-runtime.mjs --target x86_64-pc-windows-msvc

      # Windows has no inside-out signing rule and no Mach-O files, so the
      # Python tree needs nothing before the installer is signed. Authenticode
      # signs the installer and the exe inside it; the interpreter beside them
      # is data as far as the signature is concerned.
      - name: The staged engine answers before anything is bundled
        shell: bash
        run: |
          set -eu
          ./src-tauri/runtime/python.exe -m farm.farm --version
          node -p "JSON.stringify(require('./src-tauri/runtime/runtime.json'))"

      # The cargo cache keeps release/bundle/nsis between runs, so an older
      # installer rides along into the artifact glob and, on main, into the
      # signing step. Build into a clean bundle directory every time.
      - name: Clean stale bundle outputs
        shell: pwsh
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis"

      # NSIS only. tauri.conf.json says "all", which would also attempt an MSI
      # on Windows; this app ships NSIS, installed for the current user with no
      # administrator prompt.
      - name: tauri build (NSIS, unsigned)
        run: npm run tauri -- build --bundles nsis

      # SIGNING GUARDRAIL: the federated credential's subject condition only
      # matches refs/heads/main, so azure/login would fail outright on any other
      # ref. A pull request therefore builds and tests an UNSIGNED installer,
      # and only a push to main signs it. Do not widen the federated credential
      # to cover branches. A push to main also has to find AZURE_CLIENT_ID
      # before it tries to log in: without that check the very first push to a
      # repository with no secrets fails inside azure/login, which tells you
      # nothing about what is missing.
      - name: Decide whether this run can sign
        id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          on_main='${{ github.ref == 'refs/heads/main' }}'
          sign=false
          # All three, or none. azure/login needs every one of them, so a run
          # that has two fails inside the login with a message about none of
          # them, having already done the whole build. One secret set on its
          # own used to cost a release that way: the gate said yes, the login
          # said no, and the installer was never uploaded. Better to build
          # unsigned and say which are missing.
          missing=
          [ -n "$AZURE_CLIENT_ID" ] || missing="$missing AZURE_CLIENT_ID"
          [ -n "$AZURE_TENANT_ID" ] || missing="$missing AZURE_TENANT_ID"
          [ -n "$AZURE_SUBSCRIPTION_ID" ] || missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ "$on_main" = "true" ] && [ -z "$missing" ]; then sign=true; fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          # The updater signature is made after Authenticode, over the signed
          # bytes, so it needs the Tauri key as well as a signed installer.
          updater=false
          if [ "$sign" = "true" ] && [ -n "$UPDATER_KEY" ]; then updater=true; fi
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "sign=$sign updater=$updater on_main=$on_main missing=${missing:-none}"
          if [ "$sign" = "true" ] && [ "$updater" != "true" ]; then
            echo "::notice::No Windows updater signature. TAURI_SIGNING_PRIVATE_KEY is not set, so latest.json will carry no windows-x86_64 row and installed Windows copies will not update themselves."
          fi
          if [ "$sign" != "true" ] && [ -n "$missing" ]; then
            echo "::notice::Building UNSIGNED because these are not set:$missing. The installer will build and upload; it will not carry an Authenticode signature."
          elif [ "$sign" != "true" ]; then
            echo "::notice::Building UNSIGNED because this is not a push to main. The installer will build; it will not carry an Authenticode signature."
          fi

      # --- Azure Trusted Signing --------------------------------------
      # Identity: an Entra app through a GitHub OIDC federated credential,
      # scoped to refs/heads/main only. No client secret exists anywhere.
      - name: Azure login (OIDC)
        if: steps.gate.outputs.sign == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign installer (Azure Trusted Signing)
        if: steps.gate.outputs.sign == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: Titanium
          certificate-profile-name: titanium-public
          files-folder: ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Hard gate: on main the artifact only uploads if Windows itself
      # considers the Authenticode signature Valid, chain and timestamp
      # included. Off main there is nothing to verify, because the installer is
      # unsigned by design.
      - name: Verify signature
        if: steps.gate.outputs.sign == 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          $sig | Format-List Status, StatusMessage
          $sig.SignerCertificate | Format-List Subject, NotBefore, NotAfter
          if ($sig.Status -ne 'Valid') { exit 1 }

      # ORDER MATTERS, AND IT IS THE WHOLE POINT OF THIS STEP.
      #
      # Authenticode rewrites the installer: the certificate goes into the PE
      # file and every byte after the checksum moves. A Tauri updater signature
      # made at bundle time is a signature over the file as it was BEFORE that,
      # so it verifies against bytes nobody will ever download, and every
      # Windows update fails with a signature error that looks like the key is
      # wrong. So the installer is not built with createUpdaterArtifacts at all;
      # the signature is made here, by hand, over the final signed file. The
      # updater artifact on Windows IS the NSIS installer, so there is nothing
      # else to sign.
      - name: Sign the final installer for the updater
        if: steps.gate.outputs.updater == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          DIR="$CARGO_TARGET_DIR/release/bundle/nsis"
          EXE=$(ls "$DIR"/*.exe | head -1)
          # Nothing from the bundler should be lying around claiming to be this.
          rm -f "$DIR"/*.exe.sig
          npx tauri signer sign "$EXE"
          test -s "$EXE.sig"
          echo "signed $(basename "$EXE") for the updater"

      # A signature over the wrong bytes is the failure that looks like success
      # until somebody tries to update, so it is checked here against the very
      # file that will be uploaded, with the public key the shipped app carries.
      - name: The updater signature verifies against the bytes we will publish
        if: steps.gate.outputs.updater == 'true'
        shell: bash
        run: |
          set -eu
          DIR="$CARGO_TARGET_DIR/release/bundle/nsis"
          EXE=$(ls "$DIR"/*.exe | head -1)
          node scripts/verify-updater-signature.mjs "$EXE" "$EXE.sig"

      - name: Write the feed fragment
        if: steps.gate.outputs.updater == 'true'
        shell: bash
        run: |
          set -eu
          DIR="$CARGO_TARGET_DIR/release/bundle/nsis"
          EXE=$(ls "$DIR"/*.exe | head -1)
          node -e '
            const fs = require("fs");
            const path = require("path");
            const [exe, sigfile] = process.argv.slice(1);
            const version = require("./src-tauri/tauri.conf.json").version;
            // One flat filename, the same rule the Mac fragments follow: the
            // farm worker refuses any launcher key with a slash in it, and the
            // version inside the name is what earns it a one year cache.
            const name = path.basename(exe).replace(/[^A-Za-z0-9._-]+/g, "-");
            const signature = fs.readFileSync(sigfile, "utf8").trim();
            const url = `https://tiinyapp.farm/launcher/${name}`;
            fs.mkdirSync("feed", { recursive: true });
            fs.writeFileSync("feed/windows-x86_64.json",
              JSON.stringify({ version, key: "windows-x86_64", signature, url }, null, 2) + "\n");
          ' "$EXE" "$EXE.sig"
          cat feed/windows-x86_64.json

      - name: The installer's size, measured rather than projected
        shell: bash
        run: ls -l "${{ env.CARGO_TARGET_DIR }}"/release/bundle/nsis/*.exe

      # The name is stable whatever the ref: signed on main, unsigned
      # everywhere else.
      # What the bytes are, written by the machine that made them and by the
      # only machine that could check the Authenticode signature, so whatever
      # publishes them later has something to compare against.
      - name: Record what the bytes are
        shell: pwsh
        run: |
          $dir = "${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis"
          Get-ChildItem "$dir/*.exe" | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content -Encoding ascii "$dir/SHA256SUMS"
          Get-Content "$dir/SHA256SUMS"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiinyapp-farm-launcher-windows-installer
          path: |
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/*.exe.sig
            ${{ env.CARGO_TARGET_DIR }}/release/bundle/nsis/SHA256SUMS
            feed/windows-x86_64.json
          if-no-files-found: error
