  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Tiiny App Farm</title>
  <!-- app.css first, for the farm's two lights, its night and its two
       typefaces. about.css is only this window's own shapes. -->
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="about.css">
</head>
<body class="about">

    <img class="hero-mark" src="brand/farm-mark-256.png" alt="">

      <h1>Tiiny App Farm</h1>
      <p class="hero-version" id="version">Version</p>

  </div>

    <section class="sec">
      <h2>Built for</h2>
      <button class="credit" type="button" data-open="https://tiiny.ai">
        <span class="ico wide"><img src="brand/tiiny-logo.svg" alt=""></span>
        <span class="said">
          <b>Tiiny</b>
          <small>The AI Pocket Lab every app talks to.</small>
        </span>
        <span class="go" aria-hidden="true"></span>
      </button>
    </section>

    <section class="sec">
      <h2>Part of</h2>
      <button class="credit" type="button" data-open="https://tiinyapp.farm">

      <button class="credit" type="button" data-open="https://titanium.bot">

  <!-- What you can do from here -------------------------------------- -->
  <div class="foot">
    <div class="foot-act">
      <button class="btn small" type="button" id="check">
        <svg viewBox="0 0 24 24" class="glyph stroke" aria-hidden="true">
          <path d="M20 12a8 8 0 1 1-2.34-5.66"/>
          <path d="M20 4v4h-4"/>
        </svg>
        Check for updates
      </button>
      <button class="btn ghost small" type="button" id="log">Show the log</button>
    </div>
    <p class="answer" id="answer"></p>
  </div>

  <script src="about.js"></script>
</body>
</html>
